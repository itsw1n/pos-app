name: ipos

services:
  # Tooling only. Supabase CLI owns the separate local database stack.

  builder:
    build:
      context: .
      target: runner
    working_dir: /app
    volumes:
      - .:/app:delegated
    command: ['npm', 'run', 'typecheck']

  typecheck:
    build:
      context: .
      target: runner
    working_dir: /app
    volumes:
      - .:/app:delegated
    command: ['npm', 'run', 'typecheck']

  lint:
    build:
      context: .
      target: runner
    working_dir: /app
    volumes:
      - .:/app:delegated
    command: ['npm', 'run', 'lint']

  build:
    build:
      context: .
      target: web
    working_dir: /app
    volumes:
      - .:/app:delegated
    command: ['node', '/dev/null']
