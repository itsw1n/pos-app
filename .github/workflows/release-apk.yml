name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and attach Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write production env
        run: |
          printf 'EXPO_PUBLIC_APP_ENV=production\n' > .env
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "$SUPABASE_URL" >> .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> .env
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build Android APK
        run: npx eas-cli build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: |
          id=$(npx eas-cli build:list --platform android --limit 1 --json --non-interactive | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);process.stdout.write(j[0].id)})")
          npx eas-cli build:download "$id" --platform android --output /tmp/pos-application.apk --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Attach APK to release
        run: gh release upload "$TAG" /tmp/pos-application.apk
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
