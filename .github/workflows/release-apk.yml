name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the APK to (defaults to latest release)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build and attach Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write production env
        run: |
          printf 'EXPO_PUBLIC_APP_ENV=production\n' > .env
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "$SUPABASE_URL" >> .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> .env
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build Android APK
        run: npx eas-cli build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        id: download
        run: |
          url=$(npx eas-cli build:list --platform android --limit 1 --json --non-interactive | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{process.stdout.write(JSON.parse(d)[0].artifacts.buildUrl)})")
          curl -fsSL -o /tmp/pos-application.apk "$url"
          echo "apk_path=/tmp/pos-application.apk" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Attach APK to release
        run: |
          if [ -n "$TAG" ]; then :; elif [ -n "$RELEASE_TAG" ]; then TAG="$RELEASE_TAG"; else TAG="$(gh release list --limit 1 --json tagName -q '.[0].tagName')"; fi
          gh release upload "$TAG" "${{ steps.download.outputs.apk_path }}"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
